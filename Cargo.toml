[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm", "crates/cli"]

[workspace.package]
version = "0.81.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dobrinov/shape"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package.shape-wasm]
opt-level = "s"

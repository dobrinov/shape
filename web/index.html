<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="editor.css">
<style>
  /* the shell around the editor: schema's top bar (../schema/web/app.css) */
  :root { color-scheme: light dark;
    --bg: #ffffff; --line: #e1e4e8; --line-strong: #c9ced5; --fg: #1c2026; --muted: #5b636e; --bg-hover: #eef0f3;
    --mod: #935f00; --del: #c62a31; --new: #0a62d0; --new-bg: #e8f0fd;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16191e; --line: #262b32; --line-strong: #3a414b; --fg: #e3e7ec; --muted: #9ba4af; --bg-hover: #1f232a; --mod: #e3ae4c; --del: #f07a7f; --new: #6aa6f9; --new-bg: #172538; }
  }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 13px/1.45 var(--font-ui); background: var(--bg); color: var(--fg); }
  /* the app's pieces live in the editor's bar (app.js passes them in) */
  .app-bar { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--line); flex: none; }
  .app-bar .vsep, .app-bar .file { display: none; }
  .brand { display: flex; align-items: center; gap: 8px; font: 700 17px "Avenir Next", Futura, "Century Gothic", -apple-system, sans-serif; letter-spacing: -.03em; flex: none; color: var(--fg); }
  .brand img { display: block; }
  #app-actions { display: flex; gap: 6px; }
  #app-actions:empty { display: none; }
  #app-actions select, #app-actions button, #app-actions label.btn { font: inherit; height: 30px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--bg); color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  #app-actions button:hover, #app-actions label.btn:hover { background: var(--bg-hover); }
  .status { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .status.dirty { color: var(--mod); }
  .status.error { color: var(--del); }
  .update { flex: none; padding: 3px 10px; border-radius: 999px; background: var(--new-bg); color: var(--new); font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .update:hover { text-decoration: underline; }
  .update[hidden] { display: none; }
  #editor { flex: 1; min-height: 0; }
  @media (max-width: 640px) { .status, .dge-branch { display: none; } }
  #boot { margin: auto; color: var(--muted); }
</style>
</head>
<body>
<header class="app-bar">
  <div class="brand"><img src="favicon.svg" width="20" height="20" alt="">shape</div>
  <div class="vsep"></div>
  <span id="app-actions" style="display:flex;gap:6px"></span>
  <span class="file" id="file"></span>
  <span class="status" id="status"></span>
  <a class="update" id="update" target="_blank" rel="noopener" hidden></a>
</header>
<div id="editor"><p id="boot">Loading…</p></div>
<script src="pkg/shape_wasm.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>

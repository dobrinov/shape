name: Release

# A release is a version bump in Cargo.toml, a CHANGELOG.md entry, a commit
# and a tag vX.Y.Z; pushing the tag runs this workflow. It builds the binaries
# for every platform, publishes a GitHub Release with them (notes from
# CHANGELOG.md). The Homebrew formula in dobrinov/homebrew-tap follows on its
# own: a workflow there picks up the new release within the hour.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build again, e.g. v0.2.0"
        required: true

permissions:
  contents: write

# a new run for the same tag (re-run, re-tag) replaces the one in progress
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The WASM bundle is the same on every platform: build it once, share it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build the WASM bundle
        run: wasm-pack build crates/wasm --release --target no-modules --no-typescript --no-pack --out-dir ../../web/pkg
      - uses: actions/upload-artifact@v7
        with:
          name: web-pkg
          path: web/pkg
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         target: aarch64-apple-darwin,      name: macos-arm64 }
          # Intel macOS is cross-compiled on the Apple-silicon runner (the Intel runners are being retired)
          - { os: macos-14,         target: x86_64-apple-darwin,       name: macos-x86_64, cross: true }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    # signing runs once its secrets are set (see CODE_SIGNING.md); until then
    # the binaries are built unsigned, as before
    env:
      MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && 'yes' || '' }}
      WINDOWS_SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && 'yes' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: web-pkg
          path: web/pkg

      - name: Build the CLI
        shell: bash
        env:
          SHAPE_SKIP_WASM: "1"
          SHAPE_RELEASE_TAG: ${{ env.TAG }}
        # Linux binaries leave the native window out: with it they would need
        # WebKitGTK installed just to start (servers, CI); they open the browser
        run: |
          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            cargo build --release --locked -p shape --target ${{ matrix.target }} --no-default-features
          else
            cargo build --release --locked -p shape --target ${{ matrix.target }}
          fi

      # macOS: signed with the Developer ID certificate (hardened runtime, a
      # timestamp) and notarized by Apple, so it opens without a warning
      - name: Sign and notarize (macOS)
        if: ${{ startsWith(matrix.os, 'macos') && env.MACOS_SIGNING == 'yes' }}
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bin="target/${{ matrix.target }}/release/shape"
          # the certificate, in a keychain of its own for this run
          kc="$RUNNER_TEMP/sign.keychain-db"
          kpw=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          line=$(security find-identity -v -p codesigning "$kc" | grep -m1 'Developer ID Application')
          [ -n "$line" ] || { echo "MACOS_CERT_P12 holds no Developer ID Application certificate"; exit 1; }
          id=$(echo "$line" | awk '{print $2}')
          team=$(echo "$line" | sed -E 's/.*\(([A-Z0-9]+)\)"$/\1/')
          codesign --force --options runtime --timestamp --sign "$id" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          # notarized: Apple checks it, and Gatekeeper finds its ticket online
          # (a bare binary cannot carry the ticket stapled)
          ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/shape.zip"
          xcrun notarytool submit "$RUNNER_TEMP/shape.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$team" --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          grep -q '"status":"Accepted"' "$RUNNER_TEMP/notary.json" || { echo "not notarized"; exit 1; }
          security delete-keychain "$kc"

      # Windows: signed by SignPath (free for open source; certificate by
      # SignPath Foundation), so SmartScreen and antivirus trust it
      - name: shape.exe to sign (Windows)
        id: unsigned
        if: ${{ startsWith(matrix.os, 'windows') && env.WINDOWS_SIGNING == 'yes' }}
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/shape.exe
          if-no-files-found: error
      - name: Sign (Windows, SignPath)
        if: ${{ startsWith(matrix.os, 'windows') && env.WINDOWS_SIGNING == 'yes' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'shape' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use the signed shape.exe (Windows)
        if: ${{ startsWith(matrix.os, 'windows') && env.WINDOWS_SIGNING == 'yes' }}
        shell: pwsh
        run: |
          Copy-Item signed/shape.exe target/${{ matrix.target }}/release/shape.exe -Force
          $sig = Get-AuthenticodeSignature target/${{ matrix.target }}/release/shape.exe
          "signed by: $($sig.SignerCertificate.Subject) ($($sig.Status))"
          if ($sig.Status -ne 'Valid') { throw "shape.exe is not validly signed" }

      - name: Package
        id: pkg
        shell: bash
        run: |
          version="${TAG#v}"
          name="shape-${version}-${{ matrix.name }}"
          mkdir -p dist
          # `diagram`, the command's name before the rename, stays as an alias
          if [[ "${{ matrix.os }}" == windows* ]]; then
            cp "target/${{ matrix.target }}/release/shape.exe" dist/
            # no links in a zip: a two-line script instead of a second copy
            printf '@echo off\r\n"%%~dp0shape.exe" %%*\r\n' > dist/diagram.cmd
            cp README.md LICENSE* dist/ 2>/dev/null || true
            (cd dist && 7z a -tzip "../${name}.zip" shape.exe diagram.cmd README.md LICENSE* >/dev/null)
            asset="${name}.zip"
          else
            cp "target/${{ matrix.target }}/release/shape" dist/
            ln -s shape dist/diagram
            cp README.md LICENSE* dist/ 2>/dev/null || true
            tar -C dist -czf "${name}.tar.gz" shape diagram README.md $(cd dist && ls LICENSE* 2>/dev/null)
            asset="${name}.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          cat "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/shape"
          [[ "${{ matrix.os }}" == windows* ]] && bin="$bin.exe"
          "$bin" --version
          "$bin" check examples/example.shape
          "$bin" svg examples/example.shape --canvas metrics -o smoke.svg
          # shape.exe carries its icon and name (build.rs)
          if [[ "${{ matrix.os }}" == windows* ]]; then
            desc=$(powershell -NoProfile -Command "(Get-Item '$bin').VersionInfo.FileDescription")
            [[ "$desc" == Shape* ]] || { echo "shape.exe has no icon or name (got '$desc')"; exit 1; }
            powershell -NoProfile -Command "& .\\dist\\diagram.cmd --version"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.name }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          ls -la
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          path: src
          fetch-depth: 0
      # GitHub calls the release created last "latest": when two tags build
      # at once, that can be the older one. Only the highest version is.
      - name: Is this the newest version?
        id: newest
        run: |
          top=$(git -C src tag -l 'v*' --sort=-v:refname | head -1)
          echo "top tag: $top"
          echo "latest=$([ "$top" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: python3 src/scripts/changelog.py notes "$TAG" > notes.md || echo "No CHANGELOG.md entry for $TAG." > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Shape ${{ env.TAG }}
          body_path: notes.md
          generate_release_notes: true
          files: assets/*
          make_latest: ${{ steps.newest.outputs.latest }}

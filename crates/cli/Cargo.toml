[package]
name = "shape"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shape: one board for the whole project, as text, with your AI (editor, CLI, exports, prompts)"
build = "build.rs"

[[bin]]
name = "shape"
path = "src/main.rs"

[dependencies]
shape-core = { path = "../core" }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
serde_json.workspace = true
tiny_http = "0.12"

# The native window (`shape FILE` opens one; --browser for a tab) and the
# new-board save dialog. Without the `window` feature
# (`cargo build --no-default-features`) boards open in the browser as before.
tao = { version = "=0.37.1", default-features = false, features = ["rwh_06", "x11"], optional = true }
wry = { version = "=0.57.0", optional = true }
rfd = { version = "=0.17.2", optional = true }

# macOS: an app menu, so ⌘Q / ⌘C / ⌘V / ⌘Z reach the webview
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.20.0", optional = true }
# the Dock shows Shape's icon for the window (the binary is not an app bundle)
objc2 = { version = "=0.6.5", optional = true }
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSData", "NSString", "NSProcessInfo"] }

[features]
default = ["window"]
window = ["dep:tao", "dep:wry", "dep:rfd", "dep:muda", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
